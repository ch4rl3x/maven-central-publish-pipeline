name: Release

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: macos-26-intel

jobs:
  deploy-release:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: ch4rl3x/maven-central-publish-pipeline/.github/actions/prepare@v1

      - name: Publish
        run: |
          ./gradlew publishAllPublicationsToSonatypeRepository closeAndReleaseSonatypeStagingRepository -Pversion="$VERSION" --max-workers 1
        env:
          VERSION: ${{ github.event.release.tag_name }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
