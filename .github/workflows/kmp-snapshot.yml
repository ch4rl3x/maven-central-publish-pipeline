name: KMP Snapshot

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: macos-26-intel
      sample-tasks:
        description: Gradle task that builds the sample app. Empty skips the step.
        type: string
        required: false
        default: ""
      run-tests:
        type: boolean
        required: false
        default: false

jobs:
  # Tests live in this job rather than in one of their own: deploy-snapshot gates
  # on `build`, so a separate test job would not block a broken snapshot from
  # being published, and it would repeat checkout + Gradle setup on a second
  # macOS runner.
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: ch4rl3x/maven-central-publish-pipeline/.github/actions/prepare@v1

      - name: Build library
        run: ./gradlew assembleRelease

      - name: Build sample apps
        if: inputs.sample-tasks != ''
        run: ./gradlew ${{ inputs.sample-tasks }}

      - name: Build dokka
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Test library
        if: inputs.run-tests
        run: ./gradlew check

      - name: Report JVM Tests
        uses: dorny/test-reporter@v1.7.0
        if: inputs.run-tests && (success() || failure())
        with:
          name: JVM Tests
          path: '*/build/test-results/*jvm*/TEST-*.xml'
          reporter: java-junit

      - name: Report iOS Tests
        uses: dorny/test-reporter@v1.7.0
        if: inputs.run-tests && (success() || failure())
        with:
          name: iOS Tests
          path: '*/build/test-results/*ios*/TEST-*.xml'
          reporter: java-junit

  deploy-snapshot:
    needs: [ build ]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-tags: true
          fetch-depth: 0

      - uses: ch4rl3x/maven-central-publish-pipeline/.github/actions/prepare@v1

      - name: Setup git-mkver
        uses: cperezabo/setup-git-mkver@v1.2.0
        with:
          version: "1.3.0"

      - name: Generate version
        run: |
          export VERSION=$(git mkver next --pre-release)
          echo "this is version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish
        run: ./gradlew publishAllPublicationsToSonatypeRepository -Pversion=$VERSION --max-workers 1
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
