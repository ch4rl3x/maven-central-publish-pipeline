name: JVM Snapshot

# For plain JVM libraries, Gradle plugins and Android libraries: no Apple targets,
# so this runs on ubuntu instead of macOS. The release path is shared with the KMP libraries --
# call release.yml with `runner: ubuntu-latest`.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      run-tests:
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: ch4rl3x/maven-central-publish-pipeline/.github/actions/prepare@v1

      - name: Build library
        run: ./gradlew assemble

      - name: Test library
        if: inputs.run-tests
        run: ./gradlew check

      - name: Report tests
        uses: dorny/test-reporter@v3
        if: inputs.run-tests && (success() || failure())
        with:
          name: JVM Tests
          # covers plain JVM (test/) as well as Android unit tests
          # (testDebugUnitTest/, testReleaseUnitTest/)
          path: '**/build/test-results/*/TEST-*.xml'
          reporter: java-junit
          # not every repository has tests -- an empty result set is not a failure
          fail-on-empty: 'false'

  deploy-snapshot:
    needs: [ build ]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-tags: true
          fetch-depth: 0

      - uses: ch4rl3x/maven-central-publish-pipeline/.github/actions/prepare@v1

      - name: Setup git-mkver
        uses: cperezabo/setup-git-mkver@v1.2.0
        with:
          version: "1.3.0"

      - name: Generate version
        run: |
          export VERSION=$(git mkver next --pre-release)
          echo "this is version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish
        run: ./gradlew publishAllPublicationsToSonatypeRepository -Pversion=$VERSION --max-workers 1
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
